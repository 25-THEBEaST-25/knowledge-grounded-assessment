name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # PaddleOCR/PaddlePaddle are imported lazily in ocr_service and faked in
      # the test suite, so CI skips the ~1 GB install. Everything else is real.
      - name: Install dependencies (without paddle)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(paddlepaddle|paddleocr)==' backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest "httpx>=0.27"

      - name: Run backend tests
        env:
          GEMINI_API_KEY: ""
        run: python -m pytest -q

  migrations:
    # Real PostgreSQL: upgrade, downgrade, upgrade again. Verifies JSONB/UUID/FK DDL for real.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snaptix
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: snaptix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snaptix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://snaptix:ci_password@localhost:5432/snaptix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "sqlalchemy==2.0.54" "alembic==1.20.0" "psycopg[binary]==3.3.6"
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini downgrade base
      - run: alembic -c backend/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
