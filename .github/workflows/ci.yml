name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # PaddleOCR/PaddlePaddle are imported lazily in ocr_service and faked in
      # the test suite, so CI skips the ~1 GB install. Everything else is real.
      - name: Install dependencies (without paddle)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(paddlepaddle|paddleocr)==' backend/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest "httpx>=0.27"

      - name: Run backend tests
        env:
          GEMINI_API_KEY: ""
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
