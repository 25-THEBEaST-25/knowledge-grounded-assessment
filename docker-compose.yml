# Local dev infrastructure for the assessment module (one PostgreSQL DB + Qdrant).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: snaptix
      POSTGRES_PASSWORD: snaptix_dev_password   # dev-only placeholder
      POSTGRES_DB: snaptix
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
volumes:
  pgdata:
  qdrantdata:
